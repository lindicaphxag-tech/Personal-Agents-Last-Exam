name: CAPE-Certified v0.7 independent checks
on:
  push:
    branches: [research/cape-certified-v07-20261124]
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    defaults:
      run:
        working-directory: research_artifacts/cape_graph_v01
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install "numpy>=2" "scipy>=1.14"
      - run: python -m unittest discover -v -s tests
      - run: python experiments/certified_benchmark.py
      - run: |
          python -c "import json; d=json.load(open('experiments/certified_results.json')); assert d['zero_gap_cases']==d['flow_zero_gap_cases']==120; assert len(d['stress'])==6; assert all(s['lower']==s['upper']=='5' and s['flow_gap']=='0' for s in d['stress'])"
      - run: python verify_all.py
        working-directory: research_artifacts/cape_graph_v01/prior_97
