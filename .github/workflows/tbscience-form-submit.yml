name: Official TB-Science 2.0 EEG task preapproval submission
on:
  push:
    branches:
      - research/tbscience-form-submission-20261124
    paths:
      - ".github/workflows/tbscience-form-submit.yml"
      - "research_artifacts/tbscience_eeg/submit_official_form.py"
permissions:
  contents: read
jobs:
  submit-once:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install browser driver (system Chrome)
        run: python -m pip install --disable-pip-version-check playwright==1.58.0
      - name: Fill official form once, verify all required fields, retain only confirmed success
        run: python research_artifacts/tbscience_eeg/submit_official_form.py
      - name: Preserve official confirmation screenshot
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tbscience-eeg-20261124-official-form-confirmation
          path: tbscience-confirmation.png
          if-no-files-found: error
