name: TB-Science external proposal form inspection (read-only)
on:
  push:
    branches:
      - research/tbscience-form-submission-20261124
    paths:
      - ".github/workflows/tbscience-form-inspect.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install headless browser driver
        run: python -m pip install --disable-pip-version-check playwright==1.58.0
      - name: Inspect form controls without entering or submitting data
        shell: bash
        run: |
          cat > /tmp/form_inspect.py <<'PY'
          from playwright.sync_api import sync_playwright
          import json,os,time,sys
          target="https://airtable.com/appzZC5gEHrXSfNNw/pagjgS95lAQ5FVJxt/form"
          with sync_playwright() as p:
              browser=p.chromium.launch(channel="chrome",headless=True,args=["--no-sandbox","--disable-dev-shm-usage"])
              page=browser.new_page(locale="en-US",viewport={"width":1400,"height":1200})
              page.on("console",lambda msg: print("BROWSER_CONSOLE",msg.type,msg.text[:300]) if msg.type=="error" else None)
              resp=page.goto(target,wait_until="domcontentloaded",timeout=55000)
              page.wait_for_timeout(8000)
              print("PAGE_STATUS",resp.status if resp else "no response")
              print("FINAL_URL",page.url)
              print("TITLE",page.title())
              print("VISIBLE_BODY",page.locator("body").inner_text(timeout=10000)[:12500])
              controls=page.evaluate("""() => [...document.querySelectorAll('input, textarea, select, [role=combobox], [role=textbox], [contenteditable=true]')].map((el,i)=>({i,tag:el.tagName,type:el.getAttribute('type'),name:el.getAttribute('name'),placeholder:el.getAttribute('placeholder'),aria:el.getAttribute('aria-label'),id:el.id,outer:el.outerHTML.slice(0,650),parent:el.parentElement?.innerText.slice(0,400)}))""")
              print("CONTROLS_JSON",json.dumps(controls,ensure_ascii=False,indent=2)[:18000])
              btn=page.get_by_role("button").all()
              print("BUTTONS",[(x.inner_text()[:200],x.is_enabled()) for x in btn[:40]])
              page.screenshot(path="airtable-form-empty.png",full_page=True)
              browser.close()
          
          PY
          python /tmp/form_inspect.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-form-empty-screenshot
          path: airtable-form-empty.png
          if-no-files-found: ignore
